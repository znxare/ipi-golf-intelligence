name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Node 20's bundled npm occasionally crashes ("Cannot read properties of null (reading
      # 'edgesOut')") resolving the Neon Auth dependency tree's conflicting peer deps — a known
      # npm arborist bug, fixed in later npm releases.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ secrets.VITE_NEON_DATA_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
